services:
  newsreader-web:
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: newsreader-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
