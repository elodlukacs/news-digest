server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 6M;
        add_header Cache-Control "public";
    }

    # Proxy the API so a build with no VITE_API_URL still works: without this
    # block, /api/* fell through to try_files below and was answered with
    # index.html, so every API call returned "200 OK" with an HTML body.
    #
    # The upstream is held in a variable and paired with a resolver so nginx
    # starts even when the name doesn't resolve yet (requests then 502 instead
    # of the container refusing to boot). Change the host to match your backend
    # container name if it isn't `newsreader-api`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://newsreader-api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
